
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Shadows of the Truth</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080a12;color:#fff;font-family:Arial,sans-serif}
button{font:inherit;cursor:pointer}
.phone{max-width:420px;height:100dvh;min-height:600px;margin:auto;background:#101522;position:relative;overflow:hidden;display:flex;flex-direction:column}
.status{height:35px;padding:12px 20px 4px;display:flex;justify-content:space-between;font-size:12px;flex-shrink:0}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.active{display:flex}

/* HOME SCREEN */
.home{padding:30px 22px;background:linear-gradient(160deg,#18253b,#101522 60%,#25213a)}
.clock{font-size:54px;font-weight:300;margin-top:25px}
.date{color:#c0c7d8;margin-top:4px}
.notification{margin-top:25px;padding:15px;background:#ffffff19;border:1px solid #ffffff20;border-radius:17px;text-align:left;color:white;width:100%}
.notif-head{display:flex;justify-content:space-between;font-size:12px;color:#c7d1e5;margin-bottom:9px}
.notif-title{font-weight:bold;margin-bottom:5px}
.notif-body{font-size:13px;color:#e0e5ef}
.apps{margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:23px 10px;padding-bottom:22px}
.app{border:0;background:none;color:white;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px}
.app-icon{height:54px;width:54px;border-radius:16px;display:grid;place-items:center;font-size:25px;position:relative;box-shadow:0 3px 10px #0003}
.badge{position:absolute;right:-4px;top:-5px;background:#ff4d62;color:white;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:11px;border:2px solid #182137}
.dock{display:flex;justify-content:space-around;padding:13px;background:#ffffff13;border-radius:24px;margin-bottom:10px}

/* INBOX */
.topbar{padding:15px 17px;display:flex;align-items:center;gap:13px;background:#171c29;border-bottom:1px solid #2a3040;flex-shrink:0}
.back{border:0;background:none;color:white;font-size:25px;padding:0 5px}
.top-title{font-size:18px;font-weight:bold}
.muted{font-size:12px;color:#9da7ba;margin-top:4px}
.inbox-body{padding:18px 14px}
.search{background:#242a39;border-radius:12px;padding:12px;color:#9da7ba;font-size:13px;margin-bottom:16px}
.thread{width:100%;display:flex;gap:12px;align-items:center;text-align:left;color:white;border:0;background:#1b2130;padding:15px;border-radius:15px}
.avatar{height:47px;width:47px;border-radius:50%;background:#353d50;display:grid;place-items:center;font-size:23px;flex-shrink:0}
.thread-info{flex:1;min-width:0}
.thread-name{font-weight:bold;margin-bottom:6px}
.preview{color:#b1bacb;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread{width:9px;height:9px;border-radius:50%;background:#65a0ff}

.phone {
  width: 390px;
  height: 844px;
  max-width: 100%;
  margin: auto;
  background: #101522;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
/* CHAT */
#chatMessages{flex:1;min-height:0;overflow-y:auto;padding:17px 13px;display:flex;flex-direction:column;gap:12px}
.time{text-align:center;font-size:11px;color:#8994a9;margin:6px}
.bubble{max-width:86%;padding:11px 14px;border-radius:17px;font-size:14px;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap;animation:pop .18s ease}
.incoming{align-self:flex-start;background:#292f3d;border-bottom-left-radius:5px}
.outgoing{align-self:flex-end;background:#2878f0;border-bottom-right-radius:5px}
.meta{text-align:right;color:#d8e6ff;font-size:10px;margin-top:5px}
.typing{display:none;color:#aeb8ca;font-size:12px;padding:0 16px 10px}
.composer{padding:12px;background:#171c29;border-top:1px solid #2a3040;flex-shrink:0}
.hint{font-size:10px;letter-spacing:1px;color:#9da7ba;margin:0 0 9px}
.choice{width:100%;text-align:left;padding:11px 12px;margin-bottom:7px;background:#242b3b;border:1px solid #424b60;color:#fff;border-radius:12px;font-size:13px}
.choice.selected{background:#193e75;border-color:#70a8ff}
.send{width:100%;border:0;background:#347cf4;color:white;font-weight:bold;padding:13px;border-radius:12px;margin-top:3px}
.send:disabled{background:#343a49;color:#8992a3;cursor:not-allowed}
#ending{display:none;padding:16px;text-align:center;color:#cbd5e8;font-size:13px}
.home-indicator{height:17px;display:grid;place-items:center;background:#171c29;flex-shrink:0}
.home-indicator span{width:105px;height:4px;border-radius:5px;background:#c7cad1}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>11:47</span><span>● ● ▰ ▰</span></div>

  <!-- SCREEN 1: PHONE HOME -->
  <section id="home" class="screen active home">
    <div class="clock">11:47</div>
    <div class="date">Thursday night · Greyford</div>

    <button class="notification" onclick="openInbox()">
      <div class="notif-head"><span>▣ MESSAGES</span><span>now</span></div>
      <div class="notif-title">Unknown Caller</div>
      <div class="notif-body">Hey, is that Detective Tyler?</div>
    </button>

    <div class="apps">
      <button class="app" onclick="openInbox()">
        <span class="app-icon" style="background:#3284e9">✉
          <span class="badge">1</span>
        </span>Messages
      </button>
      <button class="app" onclick="unavailable('Phone')">
        <span class="app-icon" style="background:#32a86b">☎</span>Phone
      </button>
      <button class="app" onclick="unavailable('Photos')">
        <span class="app-icon" style="background:#b66ee8">▧</span>Photos
      </button>
      <button class="app" onclick="unavailable('Camera')">
        <span class="app-icon" style="background:#667085">◎</span>Camera
      </button>
      <button class="app" onclick="unavailable('Browser')">
        <span class="app-icon" style="background:#4c91d8">🌐</span>Browser
      </button>
      <button class="app" onclick="unavailable('Notes')">
        <span class="app-icon" style="background:#d5a63d">▤</span>Notes
      </button>
      <button class="app" onclick="unavailable('Settings')">
        <span class="app-icon" style="background:#6c7483">⚙</span>Settings
      </button>
      <button class="app" onclick="unavailable('Case Files')">
        <span class="app-icon" style="background:#a45e48">▣</span>Files
      </button>
    </div>
    <div class="dock">
      <button class="app" onclick="unavailable('Phone')"><span class="app-icon" style="background:#32a86b">☎</span></button>
      <button class="app" onclick="openInbox()"><span class="app-icon" style="background:#3284e9">✉</span></button>
      <button class="app" onclick="unavailable('Browser')"><span class="app-icon" style="background:#4c91d8">🌐</span></button>
    </div>
  </section>

  <!-- SCREEN 2: INBOX -->
  <section id="inbox" class="screen">
    <div class="topbar">
      <button class="back" onclick="goHome()">‹</button>
      <div>
        <div class="top-title">Messages</div>
        <div class="muted">Your conversations</div>
      </div>
    </div>
    <div class="inbox-body">
      <div class="search">⌕ Search messages</div>
      <button class="thread" onclick="openChat()">
        <div class="avatar">?</div>
        <div class="thread-info">
          <div class="thread-name">Unknown Caller</div>
          <div class="preview" id="inboxPreview">Hey, is that Detective Tyler?</div>
        </div>
        <span class="unread" id="unread"></span>
      </button>
    </div>
  </section>

  <!-- SCREEN 3: CONVERSATION -->
  <section id="chat" class="screen">
    <div class="topbar">
      <button class="back" onclick="openInbox()">‹</button>
      <div class="avatar">?</div>
      <div>
        <div class="top-title">Unknown Caller</div>
        <div class="muted">Unknown number</div>
      </div>
    </div>

    <div id="chatMessages" aria-live="polite"></div>
    <div class="typing" id="typing">Unknown Caller is typing…</div>

    <div class="composer">
      <p class="hint" id="hint">TYLER — CHOOSE A REPLY</p>
      <div id="choices"></div>
      <button class="send" id="send" disabled>Send</button>
      <div id="ending">End of opening demo.</div>
    </div>
  </section>

  <div class="home-indicator"><span></span></div>
</div>

<script>
const screens = ["home","inbox","chat"];
const messages = document.getElementById("chatMessages");
const choicesBox = document.getElementById("choices");
const sendButton = document.getElementById("send");
const hint = document.getElementById("hint");
const typing = document.getElementById("typing");
const ending = document.getElementById("ending");

let opened = false;
let selected = -1;
let stage = 0;
let waiting = false;
let conversationPreview = "Hey, is that Detective Tyler?";

const stages = [
  {
    choices: [
      "Who are you?",
      "Yes, i am"
    ],
    responses: [
      "Detective ဖြစ်ပြီး ဘာလို့ ကိုယ့်မြို့မှာ ဖြစ်ခဲ့တဲ့အမှုကိုတောင် မသိချင်ယောင်ဆောင်နေတာလဲ?",
      "Noah Vale ဆိုတဲ့ ကောင်လေးကို မှတ်မိသေးလား?"
    ],
    follow: "That boy who disappeared four years ago"
  },
  {
    choices: [
      "That isn't my business, stop spamming messages",
      "What case are you talking about?"
    ],
    responses: [
      "You can't escape from that case!",
      "The case your department closed four years ago. Noah Vale."
    ],
    follow: "You ask too many questions, Detective"
  },
  {
    choices: [
      "Give me proof that Noah is alive and he isn't runaway",
      "I'm not gonna listen you"
    ],
    responses: [
      "Then ask yourself why Noah's case was closed before anyone could prove where he went.",
      "If you don't listen to me, your son will happen same as Noah"
    ],
    follow: "If you don't want your son to end up like Noah, do as I say."
  },
  {
    choices: [
      "Stay away from my family.",
      "Threatening my family won't stop me from contacting the police."
    ],
    responses: [
      "The original case file. Look at the final witness statement and the missing attachment.",
      "Then reopen the case, Detective. That's the only warning you'll get."
    ],
    follow: "Tomorrow night, I'll contact you again"
  }
];

function showScreen(id) {
  screens.forEach(s => document.getElementById(s).classList.toggle("active",s===id));
}

function goHome(){ showScreen("home"); }
function openInbox(){ showScreen("inbox"); }
function openChat(){
  showScreen("chat");
  document.getElementById("unread").style.display="none";

  // The first message appears only when the player opens the chat.
  if(!opened){
    opened=true;
    addTime("11:47 PM");
    addMessage("in","Hey, is that Detective Tyler?");
    renderChoices();
  }
  scrollDown();
}

function unavailable(name){
  alert(name + " isn't available in this scene yet.");
}

function addTime(text){
  const el=document.createElement("div");
  el.className="time";
  el.textContent=text;
  messages.appendChild(el);
}

function addMessage(type,text){
  const bubble=document.createElement("div");
  bubble.className="bubble "+(type==="out"?"outgoing":"incoming");
  bubble.textContent=text;

  if(type==="out"){
    const meta=document.createElement("div");
    meta.className="meta";
    meta.textContent="Sent";
    bubble.appendChild(meta);
  }

  messages.appendChild(bubble);
  conversationPreview=text;
  document.getElementById("inboxPreview").textContent=text;
  scrollDown();
}

function scrollDown(){
  messages.scrollTop=messages.scrollHeight;
}

function renderChoices(){
  waiting=false;
  selected=-1;
  sendButton.disabled=true;
  choicesBox.replaceChildren();
  ending.style.display="none";

  if(stage>=stages.length){
    hint.textContent="CONVERSATION PAUSED";
    ending.style.display="block";
    sendButton.style.display="none";
    return;
  }

  sendButton.style.display="block";
  hint.textContent="TYLER — CHOOSE A REPLY";
  stages[stage].choices.forEach((text,index)=>{
    const button=document.createElement("button");
    button.className="choice";
    button.textContent=text;
    button.onclick=()=>{
      selected=index;
      [...choicesBox.children].forEach(b=>b.classList.remove("selected"));
      button.classList.add("selected");
      sendButton.disabled=false;
    };
    choicesBox.appendChild(button);
  });
}

function sendReply(){
  if(selected<0||waiting||stage>=stages.length)return;

  const current=stages[stage];
  const answer=current.choices[selected];
  const response=current.responses[selected];

  // Nothing is sent until the player presses Send.
  addMessage("out",answer);
  waiting=true;
  sendButton.disabled=true;
  choicesBox.replaceChildren();
  hint.textContent="MESSAGE SENT";
  typing.style.display="block";
  scrollDown();

  setTimeout(()=>{
    typing.style.display="none";
    addMessage("in",response);

    // Continue the conversation one message at a time.
    setTimeout(()=>{
      if(current.follow){
        typing.style.display="block";
        setTimeout(()=>{
          typing.style.display="none";
          addMessage("in",current.follow);
          stage++;
          renderChoices();
        },700);
      } else {
        stage++;
        renderChoices();
      }
    },500);
  },900);
}

sendButton.addEventListener("click",sendReply);

// Optional keyboard support: Escape returns to the previous phone screen.
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    const active=screens.find(s=>document.getElementById(s).classList.contains("active"));
    if(active==="chat")openInbox();
    else if(active==="inbox")goHome();
  }
});
</script>
</body>
</html>
